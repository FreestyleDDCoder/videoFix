plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.desaysv.videofix'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 29
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // FFmpeg prebuilts are only available for arm64-v8a
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // self-contained: engine sources live in this module's src/main/cpp
                arguments "-DUNTRUNC_FFMPEG_DIR=${(project.findProperty('untrunc.ffmpegDir') ?: 'D:/android/workspaces/ffmpeg/output/android/arm64-v8a').toString().replace('\\\\', '/')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
}